<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>login</title>
</head>
<body>
     <form action="login">
        <div class="form_body">
            <div class="form_body_text">
                <h3>LOGIN</h4>
                <p>Fill your information below.</p>
            </div>
            <div class="form_body_inputs">
                <label for="SignInMail">Email</label>
                <input type="email" id="SignInMail" required autocomplete="email" placeholder="you@email.com">
                <label for="SignInPassword">Password</label>
                <input type="password" id="SignInPassword" required autocomplete="currentPassword" placeholder="******">
            </div>
            <button class="signInButton">LOGIN</button>
            <div class="signUpCta">
                <p>Dont have an account?<a href="./assets/pages/signup.html" class="backtologin">Click Here.</a></p>
            </div>
        </div>
    </form>
</body>
</html>
