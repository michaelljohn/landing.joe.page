<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/contact.css">
    <title>contact</title>
</head>
<body>
    

    <section class="contact_hero">
        <div class="contact_hero_inner">
            <p class="contact_eyebrow">Get in touch</p>
            <h1 class="contact_title">Contact <span class="contact_title_accent">TIS Ltd</span></h1>
            <p class="contact_subtitle">
                Have a question about our training courses, inspection services, or a project you're planning?
                Send us a message and one of our qualified engineers will get back to you.
            </p>
            <a href="/index.html" class="arrow-link">back to home</a>
        </div>
    </section>

    <section class="contact_main">
        <div class="contact_grid">

            <div class="contact_form_card">
                <h2 class="contact_form_heading">Send us a message</h2>

                <form class="contact_form" action="#" method="POST">

                <div class="contact_field_row">
                    <div class="contact_field">
                    <label for="first_name" class="contact_label">First name</label>
                    <input type="text" id="first_name" name="first_name" class="contact_input" placeholder="John" required>
                    </div>
                    <div class="contact_field">
                    <label for="last_name" class="contact_label">Last name</label>
                    <input type="text" id="last_name" name="last_name" class="contact_input" placeholder="Doe" required>
                    </div>
                </div>

                <div class="contact_field">
                    <label for="email" class="contact_label">Email address</label>
                    <input type="email" id="email" name="email" class="contact_input" placeholder="name@company.com" required>
                </div>

                <div class="contact_field">
                    <label for="phone" class="contact_label">Phone number</label>
                    <input type="tel" id="phone" name="phone" class="contact_input" placeholder="+234 123 456 7890">
                </div>

                <div class="contact_field">
                    <label for="enquiry_type" class="contact_label">What can we help with?</label>
                    <select id="enquiry_type" name="enquiry_type" class="contact_select">
                    <option value="">Select an option</option>
                    <option value="training">Training courses</option>
                    <option value="inspection">Inspection services</option>
                    <option value="vendor">Vendor management</option>
                    <option value="other">Something else</option>
                    </select>
                </div>

                <div class="contact_field">
                    <label for="message" class="contact_label">Message</label>
                    <textarea id="message" name="message" class="contact_textarea" rows="5" placeholder="Tell us a bit about what you need" required></textarea>
                </div>

                <button type="submit" class="contact_submit_btn">Send message</button>

                </form>
            </div>

            

        </div>
    </section>

</body>
</html>
